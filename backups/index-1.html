<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooking Kikki</title>
<style>
  /* Colors and page look */
  body {
    margin: 0;
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    background: linear-gradient(#ffe4f1, #fff6d6);
    color: #6a2c70;
    text-align: center;
    min-height: 100vh;
  }
  h1 { margin: 16px 0 4px; font-size: 2.2em; }
  .scene { font-size: 4em; margin: 10px 0; }
  .bubble {
    display: inline-block;
    background: white;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 1.3em;
    box-shadow: 0 3px 0 #f3b6d3;
  }
  .bowl { font-size: 3em; min-height: 1.4em; margin: 14px 0; }
  .buttons button {
    font-size: 2.4em;
    margin: 6px;
    padding: 8px 14px;
    border: none;
    border-radius: 18px;
    background: white;
    box-shadow: 0 4px 0 #f3b6d3;
    cursor: pointer;
  }
  .buttons button:disabled { opacity: 0.3; cursor: default; }
  #message { font-size: 1.5em; min-height: 1.5em; margin: 10px; }
  #again {
    font-size: 1.3em; padding: 10px 20px; border: none; border-radius: 20px;
    background: #ff8fc7; color: white; cursor: pointer; display: none;
  }
  /* Bouncy cupcake when it's done */
  .pop { animation: pop 0.6s ease; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.4); } 100% { transform: scale(1); } }
</style>
</head>
<body>
  <h1>🍰 Cooking Kikki's Restaurant 🍰</h1>

  <!-- The chef and the customer -->
  <div class="scene">👩‍🍳 &nbsp; 🐻</div>
  <div class="bubble">Bear says: "Can I have a cupcake, please?" 🧁</div>

  <!-- The mixing bowl: ingredients show up here -->
  <div class="bowl" id="bowl">🥣</div>

  <!-- Click each ingredient to add it -->
  <div class="buttons">
    <button onclick="addIngredient(this, '🥚')">🥚</button>
    <button onclick="addIngredient(this, '🧈')">🧈</button>
    <button onclick="addIngredient(this, '🍓')">🍓</button>
  </div>

  <div id="message">Tap all 3 ingredients! 👆</div>
  <button id="again" onclick="location.reload()">Make another! 🔁</button>

<script>
  // How many ingredients are in the bowl
  let added = 0;

  // Put an ingredient in the bowl
  function addIngredient(button, emoji) {
    button.disabled = true;
    added = added + 1;
    document.getElementById("bowl").textContent += emoji;
    beep(400 + added * 120);

    // All 3 in? The cupcake is ready!
    if (added === 3) {
      setTimeout(cupcakeDone, 500);
    }
  }

  // Show the cupcake and celebrate
  function cupcakeDone() {
    const bowl = document.getElementById("bowl");
    bowl.textContent = "🧁✨";
    bowl.classList.add("pop");
    document.getElementById("message").textContent = "Yum! Bear loves it! 🐻💖";
    document.getElementById("again").style.display = "inline-block";
    beep(660); setTimeout(() => beep(880), 150); setTimeout(() => beep(1100), 300);
  }

  // A tiny happy sound made by the browser (no files needed)
  function beep(freq) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      gain.gain.value = 0.1;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    } catch (e) { /* no sound, that's okay */ }
  }
</script>
</body>
</html>
